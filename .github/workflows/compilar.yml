name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}      # botón "Run workflow" para compilar a mano
  schedule:
    - cron: "0 9 * * 1"      # cada lunes: recompila con el extractor más nuevo

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Versión más reciente de NewPipe Extractor
        id: npe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/TeamNewPipe/NewPipeExtractor/releases/latest | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then TAG=v0.26.5; fi
          echo "Usando NewPipe Extractor $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Descifrar clave de firma
        env:
          ALFA_KS_PASS: ${{ secrets.ALFA_KS_PASS }}
        run: |
          if [ -z "$ALFA_KS_PASS" ]; then
            echo "::error::Falta el secreto ALFA_KS_PASS (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in keystore/alfa.jks.enc \
            -out "$RUNNER_TEMP/alfa.jks" -pass env:ALFA_KS_PASS

      - name: Compilar
        env:
          ALFA_KEYSTORE: ${{ runner.temp }}/alfa.jks
          ALFA_KS_PASS: ${{ secrets.ALFA_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -PnpeVersion=${{ steps.npe.outputs.tag }} \
            -PbuildNumber=${{ github.run_number }}
          mv app/build/outputs/apk/release/app-release.apk AlfaMusic.apk
          rm -f "$RUNNER_TEMP/alfa.jks"

      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Alfa Music ${{ github.run_number }} (extractor ${{ steps.npe.outputs.tag }})
          files: AlfaMusic.apk
          make_latest: true
