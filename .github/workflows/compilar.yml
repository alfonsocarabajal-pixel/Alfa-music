name: Compilar APK

on:
  push:
    branches: [main, prueba]   # "prueba" solo compila, no publica
    paths-ignore:              # las listas de temas no cambian la app: no generan versión nueva
      - "listas/**"
      - "tools/**"
  workflow_dispatch: {}        # botón "Run workflow": compila y publica siempre
  schedule:
    - cron: "15 9 * * *"       # todos los días 06:15 (Uruguay): revisa si hay extractor nuevo

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      npe: ${{ steps.npe.outputs.tag }}
      compilar: ${{ steps.decidir.outputs.compilar }}
    steps:
      - name: Versión más reciente de NewPipe Extractor
        id: npe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/TeamNewPipe/NewPipeExtractor/releases/latest | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then TAG=v0.26.5; fi
          echo "Extractor más reciente: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: ¿Hace falta una versión nueva?
        id: decidir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPE: ${{ steps.npe.outputs.tag }}
        run: |
          # Cambios a la app o compilación a mano: siempre se compila.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "compilar=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Revisión diaria: solo si el extractor cambió respecto a la última versión publicada.
          ACTUAL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r '.name // ""' | grep -o 'extractor v[0-9.]*' | sed 's/extractor //')
          echo "Extractor en la última versión publicada: ${ACTUAL:-desconocido}"
          if [ "$ACTUAL" = "$NPE" ]; then
            echo "Sin cambios: no se publica nada hoy."
            echo "compilar=false" >> "$GITHUB_OUTPUT"
          else
            echo "Extractor nuevo ($NPE): se compila y publica."
            echo "compilar=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: revisar
    if: needs.revisar.outputs.compilar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Descifrar clave de firma y configuración
        env:
          ALFA_KS_PASS: ${{ secrets.ALFA_KS_PASS }}
        run: |
          if [ -z "$ALFA_KS_PASS" ]; then
            echo "::error::Falta el secreto ALFA_KS_PASS (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in keystore/alfa.jks.enc \
            -out "$RUNNER_TEMP/alfa.jks" -pass env:ALFA_KS_PASS
          if [ -f config/nube.env.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in config/nube.env.enc \
              -out "$RUNNER_TEMP/nube.env" -pass env:ALFA_KS_PASS
            . "$RUNNER_TEMP/nube.env"
            echo "::add-mask::$FS_GROUP"
            echo "FS_PROJECT=$FS_PROJECT" >> "$GITHUB_ENV"
            echo "FS_GROUP=$FS_GROUP" >> "$GITHUB_ENV"
            if [ -n "$FS_ADMIN" ]; then
              echo "::add-mask::$FS_ADMIN"
              echo "FS_ADMIN=$FS_ADMIN" >> "$GITHUB_ENV"   # solo para la prueba; nunca entra en la app
            fi
            if [ -n "$FS_SEED_GRUPOS" ]; then echo "FS_SEED_GRUPOS=$FS_SEED_GRUPOS" >> "$GITHUB_ENV"; fi
            if [ -n "$FS_SEED_KARAOKE" ]; then echo "FS_SEED_KARAOKE=$FS_SEED_KARAOKE" >> "$GITHUB_ENV"; fi
            rm -f "$RUNNER_TEMP/nube.env"
          else
            echo "Sin configuración de playlists compartidas: se compila sin esa función."
          fi

      - name: Pruebas automáticas (letras del karaoke y saludos)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace \
            -PnpeVersion=${{ needs.revisar.outputs.npe }} \
            -PfsProject="$FS_PROJECT" -PfsGroup="$FS_GROUP"

      - name: Probar emisoras de radio (solo avisa, no frena)
        continue-on-error: true
        run: python3 tools/probar_emisoras.py

      - name: Compilar
        env:
          ALFA_KEYSTORE: ${{ runner.temp }}/alfa.jks
          ALFA_KS_PASS: ${{ secrets.ALFA_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -PnpeVersion=${{ needs.revisar.outputs.npe }} \
            -PbuildNumber=${{ github.run_number }} \
            -PfsProject="$FS_PROJECT" \
            -PfsGroup="$FS_GROUP"
          mv app/build/outputs/apk/release/app-release.apk AlfaMusic.apk
          rm -f "$RUNNER_TEMP/alfa.jks"

      - name: Verificar Firebase (escribir, leer y borrar una playlist de prueba)
        if: env.FS_PROJECT != ''
        run: |
          P="$FS_PROJECT"; G="$FS_GROUP"
          ROOT="projects/$P/databases/(default)/documents"
          DOC="$ROOT/grupos/$G/playlists/zz-prueba-compilacion"
          API="https://firestore.googleapis.com/v1"
          fail() { echo "::error::$1"; echo "$2" | head -c 600; exit 1; }
          BODY=$(jq -n --arg n "$DOC" '{writes:[{update:{name:$n,fields:{
            nombre:{stringValue:"prueba"},autor:{stringValue:"ci"},
            actualizada:{integerValue:"0"},canciones:{arrayValue:{values:[]}}}}}]}')
          R=$(curl -s -w '\n%{http_code}' -X POST "$API/$ROOT:commit" -H 'Content-Type: application/json' -d "$BODY")
          [ "$(echo "$R" | tail -1)" = "200" ] || fail "Firebase rechazó la escritura (¿reglas publicadas? ¿base creada?)" "$R"
          R=$(curl -s -w '\n%{http_code}' "$API/$ROOT/grupos/$G/playlists?pageSize=5")
          [ "$(echo "$R" | tail -1)" = "200" ] || fail "Firebase rechazó la lectura" "$R"
          BODY=$(jq -n --arg n "$DOC" '{writes:[{delete:$n}]}')
          R=$(curl -s -w '\n%{http_code}' -X POST "$API/$ROOT:commit" -H 'Content-Type: application/json' -d "$BODY")
          [ "$(echo "$R" | tail -1)" = "200" ] || fail "Firebase rechazó el borrado" "$R"
          echo "Firebase OK: escritura, lectura y borrado funcionan."

      - name: Verificar invitaciones (reglas de acceso)
        if: env.FS_ADMIN != ''
        run: |
          ROOT="projects/$FS_PROJECT/databases/(default)/documents"
          API="https://firestore.googleapis.com/v1"
          C=ZZPRUEBA
          INV="$ROOT/grupos/$FS_GROUP/invitaciones/$C"
          EMI="$ROOT/grupos/$FS_GROUP/admins/$FS_ADMIN/emitidas/$C"
          commit() { curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "$API/$ROOT:commit" -H 'Content-Type: application/json' -d "$1"; }
          expect() { [ "$2" = "$1" ] || { echo "::error::$3 (esperado $1, vino $2). Revisá que las reglas nuevas estén publicadas en Firebase."; head -c 500 /tmp/r.txt; exit 1; }; }
          # Limpieza de una prueba anterior que haya quedado a medias
          commit "$(jq -n --arg e "$EMI" --arg i "$INV" '{writes:[{update:{name:$e,fields:{revocada:{integerValue:"1"}}},updateMask:{fieldPaths:["revocada"]}},{delete:$i}]}')" >/dev/null
          commit "$(jq -n --arg e "$EMI" '{writes:[{delete:$e}]}')" >/dev/null

          INVF='{nombre:{stringValue:"prueba"},creada:{integerValue:"1"},dispositivo:{stringValue:""},modelo:{stringValue:""},activada:{integerValue:"0"}}'
          S=$(commit "$(jq -n --arg i "$INV" "{writes:[{update:{name:\$i,fields:$INVF}}]}")")
          expect 403 "$S" "Cualquiera podría crear invitaciones sin la clave de administrador"
          S=$(commit "$(jq -n --arg e "$EMI" --arg i "$INV" "{writes:[{update:{name:\$e,fields:{nombre:{stringValue:\"prueba\"},creada:{integerValue:\"1\"},revocada:{integerValue:\"0\"}}}},{update:{name:\$i,fields:$INVF}}]}")")
          expect 200 "$S" "El administrador no pudo crear una invitación"
          S=$(curl -s -o /tmp/r.txt -w '%{http_code}' "$API/$INV"); expect 200 "$S" "No se pudo leer la invitación"
          CLAIM='{writes:[{update:{name:$i,fields:{dispositivo:{stringValue:$d},modelo:{stringValue:"ci"},activada:{integerValue:"2"}}},updateMask:{fieldPaths:["dispositivo","modelo","activada"]}}]}'
          S=$(commit "$(jq -n --arg i "$INV" --arg d tel1 "$CLAIM")"); expect 200 "$S" "No se pudo activar la invitación"
          S=$(commit "$(jq -n --arg i "$INV" --arg d tel2 "$CLAIM")"); expect 403 "$S" "Un código ya usado se pudo activar en otro teléfono"
          REPORT='{writes:[{update:{name:$i,fields:{version:{integerValue:"99"},visto:{integerValue:"5"}}},updateMask:{fieldPaths:["version","visto"]}}]}'
          S=$(commit "$(jq -n --arg i "$INV" "$REPORT")"); expect 200 "$S" "La app no pudo informar su versión"
          S=$(curl -s -o /tmp/r.txt -w '%{http_code}' "$API/$ROOT/grupos/$FS_GROUP/admins/CLAVEFALSA/emitidas"); expect 403 "$S" "Se pudo listar invitaciones sin la clave"
          S=$(commit "$(jq -n --arg i "$INV" '{writes:[{delete:$i}]}')"); expect 403 "$S" "Se pudo borrar una invitación sin la clave"
          MOVE_INV='{update:{name:$i,fields:{grupo:{stringValue:"zzotro"}}},updateMask:{fieldPaths:["grupo"]}}'
          MOVE_EMI='{update:{name:$e,fields:{grupo:{stringValue:"zzotro"}}},updateMask:{fieldPaths:["grupo"]}}'
          KAR_INV='{update:{name:$i,fields:{karaoke:{booleanValue:true}}},updateMask:{fieldPaths:["karaoke"]}}'
          KAR_EMI='{update:{name:$e,fields:{karaoke:{booleanValue:true}}},updateMask:{fieldPaths:["karaoke"]}}'
          S=$(commit "$(jq -n --arg i "$INV" "{writes:[$KAR_INV]}")"); expect 403 "$S" "Se pudo activar el karaoke sin la clave"
          S=$(commit "$(jq -n --arg e "$EMI" --arg i "$INV" "{writes:[$KAR_EMI,$KAR_INV]}")"); expect 200 "$S" "El administrador no pudo activar el karaoke"
          S=$(commit "$(jq -n --arg i "$INV" "{writes:[$MOVE_INV]}")"); expect 403 "$S" "Se pudo cambiar de grupo sin la clave"
          S=$(commit "$(jq -n --arg e "$EMI" --arg i "$INV" "{writes:[$MOVE_EMI,$MOVE_INV]}")"); expect 200 "$S" "El administrador no pudo cambiar de grupo"
          S=$(curl -s -o /tmp/r.txt -w '%{http_code}' "$API/$ROOT/grupos/$FS_GROUP/admins/$FS_ADMIN/grupos"); expect 200 "$S" "El administrador no pudo leer los grupos"
          S=$(curl -s -o /tmp/r.txt -w '%{http_code}' "$API/$ROOT/grupos/$FS_GROUP/admins/CLAVEFALSA/grupos"); expect 403 "$S" "Se pudieron leer los grupos sin la clave"
          PL="$ROOT/grupos/$FS_GROUP/equipos/zzotro/playlists/zz-prueba"
          S=$(commit "$(jq -n --arg n "$PL" '{writes:[{update:{name:$n,fields:{nombre:{stringValue:"prueba"},autor:{stringValue:"ci"},actualizada:{integerValue:"0"},canciones:{arrayValue:{values:[]}}}}}]}')")
          expect 200 "$S" "No se pudo guardar una playlist en un grupo nuevo"
          S=$(commit "$(jq -n --arg n "$PL" '{writes:[{delete:$n}]}')"); expect 200 "$S" "No se pudo borrar la playlist de prueba del grupo"
          S=$(commit "$(jq -n --arg e "$EMI" --arg i "$INV" '{writes:[{update:{name:$e,fields:{revocada:{integerValue:"3"}}},updateMask:{fieldPaths:["revocada"]}},{delete:$i}]}')")
          expect 200 "$S" "El administrador no pudo revocar"
          S=$(commit "$(jq -n --arg e "$EMI" '{writes:[{delete:$e}]}')"); expect 200 "$S" "No se pudo limpiar la prueba"
          echo "Invitaciones y grupos OK: solo el administrador crea, mueve y revoca; cada código sirve para un teléfono; cada grupo guarda sus playlists."

      - name: Crear grupos iniciales (si todavía no existen)
        if: env.FS_SEED_GRUPOS != '' && env.FS_ADMIN != ''
        run: |
          ROOT="projects/$FS_PROJECT/databases/(default)/documents"
          API="https://firestore.googleapis.com/v1"
          for ITEM in $(echo "$FS_SEED_GRUPOS" | tr ',' ' '); do
            ID="${ITEM%%:*}"; N="${ITEM#*:}"
            BODY=$(jq -n --arg g "$ROOT/grupos/$FS_GROUP/admins/$FS_ADMIN/grupos/$ID" --arg n "$N" \
              '{writes:[{update:{name:$g,fields:{nombre:{stringValue:$n}}},currentDocument:{exists:false}}]}')
            S=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "$API/$ROOT:commit" -H 'Content-Type: application/json' -d "$BODY")
            case "$S" in
              200) echo "Grupo creado: $N" ;;
              400|409) echo "El grupo $N ya existía" ;;
              *) echo "::error::No se pudo crear el grupo $N ($S)"; head -c 400 /tmp/r.txt; exit 1 ;;
            esac
          done

      - name: Activar karaoke inicial
        if: env.FS_SEED_KARAOKE != '' && env.FS_ADMIN != ''
        run: |
          ROOT="projects/$FS_PROJECT/databases/(default)/documents"
          API="https://firestore.googleapis.com/v1"
          for C in $(echo "$FS_SEED_KARAOKE" | tr ',' ' '); do
            BODY=$(jq -n --arg e "$ROOT/grupos/$FS_GROUP/admins/$FS_ADMIN/emitidas/$C" \
              --arg i "$ROOT/grupos/$FS_GROUP/invitaciones/$C" \
              '{writes:[
                {update:{name:$e,fields:{karaoke:{booleanValue:true}}},updateMask:{fieldPaths:["karaoke"]},currentDocument:{exists:true}},
                {update:{name:$i,fields:{karaoke:{booleanValue:true}}},updateMask:{fieldPaths:["karaoke"]},currentDocument:{exists:true}}]}')
            S=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "$API/$ROOT:commit" -H 'Content-Type: application/json' -d "$BODY")
            if [ "$S" = "200" ]; then echo "Karaoke activado para $C"
            else echo "::warning::No se pudo activar el karaoke para $C ($S)"; head -c 300 /tmp/r.txt; fi
          done

      - name: Publicar para descargar desde el celular
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Alfa Music ${{ github.run_number }} (extractor ${{ needs.revisar.outputs.npe }})
          files: AlfaMusic.apk
          make_latest: true
